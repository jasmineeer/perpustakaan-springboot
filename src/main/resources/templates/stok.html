<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kelola Stok Buku</title>
</head>
<body>
<h1>Kelola Stok Buku</h1>
<p>Aktor: Pustakawan</p>

<div th:if="${sukses}" style="color:#1b5e20">
    <p th:text="${sukses}">Berhasil</p>
</div>
<div th:if="${galat}" style="color:#b00020">
    <p th:text="${galat}">Gagal</p>
</div>

<table border="1">
    <tr><th>ID</th><th>Judul</th><th>Stok</th><th>Tambah Stok</th><th>Atur Stok</th></tr>
    <tr th:each="b : ${daftarBuku}">
        <td th:text="${b.idBuku}">B001</td>
        <td th:text="${b.judul}">Judul</td>
        <td th:text="${b.stok}">0</td>
        <td>
            <form th:action="@{/stok/tambah}" method="post">
                <input type="hidden" name="idBuku" th:value="${b.idBuku}">
                <input type="number" name="jumlah" min="1" value="1" required>
                <button type="submit">Tambah</button>
            </form>
        </td>
        <td>
            <form th:action="@{/stok/atur}" method="post">
                <input type="hidden" name="idBuku" th:value="${b.idBuku}">
                <input type="number" name="stokBaru" min="0" th:value="${b.stok}" required>
                <button type="submit">Simpan</button>
            </form>
        </td>
    </tr>
</table>
<p><a th:href="@{/pinjam}">Ke halaman Pinjam Buku</a></p>
</body>
</html>
